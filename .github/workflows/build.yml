
name: Build DuoOS ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache
          df -h /

      - name: Build DuoOS ISO in Arch Linux
        run: |
          docker run --privileged --rm -v "$PWD":/repo archlinux bash -euc '
            pacman -Syu --noconfirm
            cd /repo/duoos
            chmod +x build.sh
            ./build.sh
          '

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: duoos-iso
          path: duoos/out/*.iso
          if-no-files-found: error
          retention-days: 7
